<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>بوابة الصيدلية | دوائي الأبيض</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="pharmacy.css">
</head>
<body>
<header class="bar">
  <div><strong>💊 دوائي الأبيض</strong><span>بوابة الصيدلية</span></div>
  <button id="logoutBtn" class="outline">تسجيل الخروج</button>
</header>

<main>
  <section id="loginView" class="panel">
    <div class="icon">🏪</div>
    <h1>دخول الصيدلية</h1>
    <p>حدّث توفر الأدوية ليعرف سكان الأبيض أين يجدون الدواء.</p>
    <form id="loginForm">
      <label>البريد الإلكتروني<input id="email" type="email" required></label>
      <label>كلمة المرور<input id="password" type="password" required></label>
      <button class="primary">تسجيل الدخول</button>
    </form>
    <button id="showRegister" class="link">تسجيل صيدلية جديدة</button>
    <div id="loginMsg" class="msg"></div>
  </section>

  <section id="registerView" class="panel hidden">
    <div class="icon">➕</div>
    <h1>تسجيل صيدلية</h1>
    <p>سيتم مراجعة الطلب واعتماد الصيدلية من الإدارة.</p>
    <form id="registerForm">
      <label>اسم الصيدلية<input id="rName" required></label>
      <label>رقم الهاتف<input id="rPhone" required></label>
      <label>البريد الإلكتروني<input id="rEmail" type="email" required></label>
      <label>كلمة المرور<input id="rPassword" type="password" minlength="8" required></label>
      <label>العنوان<input id="rAddress"></label>
      <label class="check"><input id="rDelivery" type="checkbox"> تتوفر خدمة التوصيل</label>
      <button class="primary">إرسال طلب التسجيل</button>
    </form>
    <button id="showLogin" class="link">العودة إلى تسجيل الدخول</button>
    <div id="registerMsg" class="msg"></div>
  </section>

  <section id="dashboardView" class="hidden">
    <div class="welcome panel">
      <div><span>مرحبًا بكم في</span><h1 id="pharmacyName">الصيدلية</h1><p>حدّث حالة توفر الدواء والكمية.</p></div>
      <div class="big-icon">🏪</div>
    </div>

    <div class="stats">
      <div><span>الأدوية المسجلة</span><strong id="totalCount">0</strong></div>
      <div><span>متوفرة</span><strong id="availableCount">0</strong></div>
      <div><span>كمية محدودة</span><strong id="limitedCount">0</strong></div>
    </div>

    <section class="panel">
      <div class="panel-title"><h2>مخزون الأدوية</h2><button id="refreshBtn" class="outline">تحديث</button></div>
      <div id="inventoryList"></div>
    </section>
  </section>
</main>
<script src="pharmacy.js"></script>
</body>
</html>
